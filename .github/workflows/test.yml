name: Tests

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  harvester-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run harvester test suite
        run: docker compose -f docker/docker-compose.test.yml run --rm ckan-test
